# 本機開發的連線設定與金鑰範本。複製成 secrets.local.yaml 再填值；secrets.local.yaml 已被 .gitignore 擋住，不要 commit。
# 這個範本本身進 git，所以這裡只能是空的或假的值。
es:
  url: http://127.0.0.1:19200            # 先開 port-forward：kubectl --context rancher-desktop -n es-test port-forward svc/elasticsearch 19200:9200
  AIOPS_ES_API_KEY: ""                   # 唯讀 key，建法見 README「建立平台的唯讀 ES key」
api:
  AIOPS_API_TOKEN: ""                    # 本機呼叫平台 API 用，隨便設一組長字串
llm:
  AIOPS_LLM_API_KEY: ""                  # 要用真的 LLM 才填；provider 是 noop 就留空
