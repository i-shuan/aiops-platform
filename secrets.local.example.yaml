# 本機開發的連線設定與金鑰範本。複製成 secrets.local.yaml 再填值；secrets.local.yaml 已被 .gitignore 擋住，不要 commit。
# 這個範本本身進 git，所以這裡只能是空的或假的值。
grafana:
  AIOPS_GRAFANA_URL: http://127.0.0.1:13000   # 平台經 Grafana 讀 trace／日誌（不再直連 Elasticsearch）；先開到 Grafana 的 port-forward
  AIOPS_GRAFANA_TOKEN: ""                # Grafana service account token（機密）
  AIOPS_GRAFANA_TRACES_UID: ""           # Grafana 裡 trace 的 Elasticsearch 資料源 UID（不是機密）
  AIOPS_GRAFANA_LOGS_UID: ""             # Grafana 裡錯誤日誌的 Elasticsearch 資料源 UID（不是機密）
api:
  AIOPS_API_TOKEN: ""                    # 本機呼叫平台 API 用，隨便設一組長字串
llm:
  AIOPS_LLM_API_KEY: ""                  # 要用真的 LLM 才填；provider 是 noop 就留空
