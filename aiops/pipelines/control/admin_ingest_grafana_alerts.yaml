name: admin_ingest_grafana_alerts
description: "各團隊自己的 Grafana 告警經 webhook 推進來，轉成外部異常（POST /api/v1/ingestion/grafana-alerts）；下一輪由那條管線收斂並出 RCA 建議"
nodes:
  - name: ingest_grafana_alerts
    operator: admin.ingest_grafana_alerts
    params:
      # 實體從哪個標籤來：依序找第一個有值的。值要跟關係圖的服務名稱（trace 的 service.name）一樣，收斂與 RCA 才對得上
      entity_labels: [service, service_name]
      metric_label: alertname
      # 嚴重度 -> 分數（不分大小寫）。分數對到偵測管線 alert.notify_payload 的 severity_thresholds：P0 ≥ 10、P1 ≥ 6、P2 ≥ 3、P3 ≥ 0
      severity_label: severity
      severity_scores:
        critical: 10
        p0: 10
        high: 6
        error: 6
        p1: 6
        warning: 3
        p2: 3
        info: 1
        p3: 1
      # 沒有 severity 標籤、或值不在上面：用這個分數（P2），attrs 記 score_source=default。設成 null 就改成拒收
      default_score: 3
      # 心跳告警的標籤：團隊 Grafana 設一條一直觸發的告警、帶 aiops_heartbeat=true，平台只數它、不開事故卡。
      # 看門狗（pipelines/watchdog/）靠它分辨「對方沒事」跟「對方的告警管道斷了」
      heartbeat_label: aiops_heartbeat
