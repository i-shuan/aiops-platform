name: factory
description: "工廠：機台／Lot。告警由各團隊（或 FDC）推進來，平台依 Lot 流向收斂、出 RCA 建議"
# 告警從哪裡來：各團隊自己的監控系統／Grafana 設告警規則，經 webhook 推進平台（POST /api/v1/ingestion/grafana-alerts?pipeline=factory，
# docs/EXTERNAL_ALERTS.md）；也可以用 POST /api/v1/ingestion/anomalies 直接推。什麼算異常由設規則的團隊決定。
# 這條管線不抓資料、不跑偵測器（平台的偵測演算法只用來監控 AIOps 平台自己）：每一輪只處理這段時間推進來的外部告警，
# 用關係圖收斂成事件群、計分、抑制、送事故卡；沒有告警推進來，這一輪就只送心跳（平台自己活著），不產生任何事故卡。
# 這條管線的事件群預設用哪條 RCA 管線（POST /api/v1/rca 沒帶 workflow 時）。沒有 trace：不走 LLM（沒有 span 事實可判），用舊引擎，退回拓撲／Lot 流向推測
rca_workflow: rca_report

nodes:
  # ── 全部是批次層：這一輪推進來的外部告警合併後依序處理 ──
  - name: group_entity
    operator: alert.same_entity
  # 依 Lot 履歷的流向（上游機台 -> 下游機台）把同一批 Lot 經過的機台告警併成一件事：告警的 service 標籤填機台代號
  - name: group_lot_path
    operator: alert.lot_path_chain
    params: {window_minutes: 60}
  - name: score_p0
    operator: alert.p0_boost
    params: {entities: []}
  # 進行中的事件群吸收這一輪的新異常：一場事故從頭到尾只有一個 incident_uid、一張卡（Grafana 重送還沒結束的告警也併進同一張）
  - name: absorb_open
    operator: alert.absorb_open
  - name: suppress_window
    operator: alert.suppress_window
  - name: suppress_dedup
    operator: alert.suppress_dedup
    params: {cooldown_minutes: 30}

  # 定嚴重度、產生通知內容。外部告警的分數來自團隊設的 severity（對照表在 pipelines/control/admin_ingest_grafana_alerts.yaml）
  - name: payload
    operator: alert.notify_payload
    params: {severity_thresholds: {P0: 10, P1: 6, P2: 3, P3: 0}}
  # 進行中事件群：用最新內容續命、升級時先關舊標籤再送新的、安靜滿 resolve_after_minutes 才結案（防抖動）。
  # 各團隊 Grafana 的 repeat interval 要不超過這個分鐘數，不然告警還沒結束事故卡就會先結案（docs/EXTERNAL_ALERTS.md）
  - name: heartbeat
    operator: alert.heartbeat
    params: {resolve_after_minutes: 15}
  # 依環境變數 AIOPS_NOTIFIER 選 log 或 alertmanager；要固定就改 notifier.alertmanager
  - name: notify
    operator: notifier.auto
  # 自我健康心跳（Dead Man's Snitch）：寫入成功才送；排程停了或整輪失敗，ttl 到期就會收到 resolved
  - name: watchdog
    operator: notifier.watchdog
    params: {ttl_minutes: 15}
