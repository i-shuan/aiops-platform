name: it_otel_snr
description: "IT：同 it_otel（hourly_baseline＋mad＋quantile_drift），但門檻由 SNR／p_fa 換算、多數決改成軟投票（四組比較的 A+SNR）"

nodes:
  # 注意 Prometheus 單次查詢上限約 11000 點：step 60 秒抓 7 天是 10081 點，剛好在上限內。
  # 流量類指標建議累積 3~4 週再信任 168 時段基準線（要更長就把 train_lookback_minutes 加大、step_seconds 調大）。
  - name: fetch
    operator: ingestion.fetch
    params: {lookback_minutes: 60, train_lookback_minutes: 10080, retrain_minutes: 1440}

  # 異常檢測：三個偵測器各自判斷，再由 detector.ensemble 多數決（超過一半同意才算異常）。
  # 真實資料回放：多數決比聯集少 88% 的警報分鐘數，核心事件全部留下。要換演算法就換這裡的節點
  # （detector.zscore / mad / shift / peer / rules / chronic / dod / wow / quantile_drift）。
  # min_weeks: 1 是刻意的取捨：7 天訓練時每個時段只看過一次，標準差會被低估、單獨看會比較吵；
  # 但它在多數決裡比「退回 zscore」少很多誤報（真實資料回放：多數決區間外警報 59 筆 vs 148 筆）。
  # 拿掉這個參數（預設 min_weeks: 2）就會在資料不足 2 週時自動退回 zscore。
  - name: detect
    operator: detector.hourly_baseline
    params: {tz: Asia/Taipei, min_weeks: 1, snr: {p_fa: 0.001, tz: Asia/Taipei}}
  - name: detect_mad
    operator: detector.mad
    params: {snr: {p_fa: 0.001, tz: Asia/Taipei}}
  - name: detect_qdrift
    operator: detector.quantile_drift
    params: {snr: {p_fa: 0.001, tz: Asia/Taipei}}
  # 雙軌制・軌道一（致命硬上限）：物理／業務上「踩到就是出事」的界線，單點成立、不交給多數決。
  # 預設不做事：只有在 target 的 overrides.fatal 訂了界線的序列才會判（見下面 targets 的範例）。
  # 它不投票（vote 的 bypass），事件原樣留下，score_fatal 直接拉到 P0。界線只認 YAML，後台調參改不到。
  - name: fatal
    operator: detector.hard_limit
  # +SNR（docs/RESIDUAL_SNR_ENSEMBLE.md「四組比較」）：投票節點都開 snr——算序列 SNR、門檻改由目標逐點虛警率 p_fa 換算
  # （白化過的節點 z_{1−p_fa/2}；沒白化的取它與訓練期分數 1−p_fa 經驗分位數的大者），逐點證據交給 detector.soft_vote：
  # 每票 = 分數 / 門檻，加總達到 2 票等值就成立。
  - name: vote
    operator: detector.soft_vote
    params: {votes: 2, bypass: [fatal]}
  - name: new_only
    operator: detector.new_only

  # ── 以下是批次層（所有序列的異常合併後）──
  - name: group_entity
    operator: alert.same_entity
  - name: group_topology
    operator: alert.topology_chain
  # 訊息佇列：生產者先出事、消費者晚一點才出事的兩群併成一件事（非同步邊由 admin_topology_refresh 沉澱；沒有邊就不做事）
  - name: group_messaging
    operator: alert.messaging_link
  - name: score_golden
    operator: alert.golden_signals
  - name: score_p0
    operator: alert.p0_boost
    params: {entities: []}
  # 軌道一的事件：分數至少拉到 payload 的 P0 門檻，並打上 fatal:<節點> 標籤（通知 annotations.fatal）
  - name: score_fatal
    operator: alert.fatal_floor
    params: {nodes: [fatal], severity: P0}
  # 進行中的事件群吸收這一輪的新異常：一場事故從頭到尾只有一個 incident_uid、一張卡（不再每 30 分鐘另開一張）
  - name: absorb_open
    operator: alert.absorb_open
  - name: suppress_window
    operator: alert.suppress_window
  - name: suppress_root_cause
    operator: alert.suppress_same_root_cause
    params: {exempt_tags: [fatal]}  # 踩到致命硬上限的服務就算下游也在告警，自己那張也要發
  - name: suppress_dedup
    operator: alert.suppress_dedup
    # escalate_tags：30 分鐘內才發過 P2／P3 的實體踩到致命硬上限，照發 P0（上一張已經是 P0 才去重）
    params: {cooldown_minutes: 30, escalate_tags: [fatal]}

  # 定嚴重度、產生通知內容。links = 深度連結：設定了環境變數 AIOPS_GRAFANA_URL 才會在卡片 annotations 加
  # grafana_dashboard_url（APM 總覽鎖在事故的服務與時間）、grafana_traces_url／grafana_logs_url（Explore 查詢）
  - name: payload
    operator: alert.notify_payload
    params:
      severity_thresholds: {P0: 10, P1: 6, P2: 3, P3: 0}
      links: {dashboard: d/apm-overview, var: service, pad_minutes: 15, datasources: {traces: apm-traces, logs: apm-logs}}
  # 進行中事件群：用最新內容續命、升級時先關舊標籤再送新的、安靜滿 resolve_after_minutes 才結案（防抖動）。
  # 要排在 payload 之後（升級的嚴重度由 payload 算）
  - name: heartbeat
    operator: alert.heartbeat
    params: {resolve_after_minutes: 15}
  # 依環境變數 AIOPS_NOTIFIER 選 log 或 alertmanager；要固定就改 notifier.alertmanager
  - name: notify
    operator: notifier.auto
  # 自我健康心跳（Dead Man's Snitch）：寫入成功才送；排程停了或整輪失敗，ttl 到期就會收到 resolved
  - name: watchdog
    operator: notifier.watchdog
    params: {ttl_minutes: 15}

targets:
  # 範例（mock 資料源）。正式使用請複製這個檔，改成自己的 targets。
  # attrs.signal（latency／errors／traffic／saturation）：alert.golden_signals 加權與 RCA 建議處置的故障特徵都靠它判斷
  # 這條序列是哪一類；ES 這種 metric 是整段查詢 JSON 的資料源判不出類別，不填就不會觸發
  # overrides 示範分母底噪 min_scale（單位跟指標一樣）：MAD／標準差小於它就用它當分母，避免幾乎不動的序列一點雜訊就爆分。
  # 沒填時的通用保底是 min_scale_ratio（中心值的 1%）與整數序列的 1 個單位；單位只有 target 自己知道，例如：
  #   每分鐘失敗數 -> {detect_mad: {min_scale: 0.5}, detect: {min_scale: 0.5}}
  #   延遲 µs（ES 的 transaction.duration.summary.sum）-> {detect_mad: {min_scale: 5000}}
  #   這裡的 cpu 百分比：0.5 個百分點以內的抖動不算
  # 致命硬上限寫在 overrides.fatal（沒寫的序列不受影響），例如：
  #   錯誤率（0~1）    -> {fatal: {fatal_ceiling: 0.5, plausible_max: 1}}
  #   每分鐘請求數瞬斷 -> {fatal: {max_drop: 500}}       跟前一分鐘比一步掉超過 500
  #   單點尖峰         -> {fatal: {max_deviation_ratio: 20}}  偏離前 30 點中位數超過 20 倍
  - {source_type: mock, query: 'cpu{service="cart"}', entity: cart, attrs: {dept: payments, signal: saturation},
     overrides: {detect_mad: {min_scale: 0.5}}}
  - {source_type: mock, query: 'cpu{service="redis"}', entity: redis, attrs: {dept: platform, signal: saturation}}
