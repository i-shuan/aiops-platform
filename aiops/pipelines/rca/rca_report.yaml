name: rca_report
description: "針對一個事件群產生 RCA 報告（IT／工廠共用；資料不足的段落自動略過）"
nodes:
  # 隨需撈事件前 15 分鐘到結束的 trace（日常偵測不撈 trace，只有出報告時才撈這一小段）。
  # ES 沒設定就略過、連不上就記進 errors 並略過，報告照出；根因就只用既有的拓撲
  - name: fetch_traces
    operator: ingestion.incident_traces
    params: {source_type: elasticsearch, before_minutes: 15, after_minutes: 0, max_spans: 20000}
  # 用撈到的 span 現場還原服務呼叫關係，跟既有拓撲取聯集
  - name: build_topology
    operator: rca.build_dynamic_topology
    params: {mode: merge, min_calls: 1}
  # 隨需撈事件期間與事件前 60 分鐘的錯誤日誌（只撈事件裡的服務），給 log_patterns 段落比對哪種例外暴增；
  # 一樣是沒設定就略過、連不上就記進 errors，報告照出
  - name: fetch_logs
    operator: ingestion.incident_logs
    params: {source_type: elasticsearch, before_minutes: 5, after_minutes: 5, baseline_minutes: 60, max_logs: 5000}
  # 根因演算法：預設 evidence（這一輪撈到的 span 的自身耗時增量＋流量放大歸因，證據不足就不指認）。
  # 產生器兩套標準答案（2 週正式劇本，基準 15／60 分鐘）2/2 命中；topological／pagerank 在 load_amplification 都排錯，
  # 但它們不需要 trace，沒有 trace 的環境可以換回 rca.root_cause.topological。數字見 README「RCA」一節
  - name: root_cause
    operator: rca.root_cause.evidence
  - name: report
    operator: rca.report
    params:
      sections: [summary, timeline, affected_entities, golden_signals, root_cause_candidates,
                 propagation_path, trace_evidence, log_patterns, similar_cases, suggested_actions]
  # 可選 AI 總結：provider 設為 noop 即完全不連外、直接用模板；金鑰只從環境變數 AIOPS_LLM_API_KEY 讀
  - name: summary
    operator: enrichment.llm_summary
    optional: true  # 旁路節點：失敗只記進 errors，RCA 段落照常回傳
    params: {provider: noop}
