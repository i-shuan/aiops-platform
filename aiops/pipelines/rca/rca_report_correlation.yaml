name: rca_report_correlation
description: "RCA 報告（根因用時序互相關排序）：重抓事件時段的原始時序，看誰的波動領先別人"
nodes:
  # 重抓事件時段的原始時序。沒資料、查詢錯的那條只略過；資料源連不上（已重試）也只略過並寫進 errors，
  # 報告照出（沒有時序就排不出互相關根因，那一段略過；傳播路徑用既有拓撲）。不是靜默：errors 與 series_fetch.skipped 都會列出
  - name: series
    operator: ingestion.incident_series
    optional: true
    params: {before_minutes: 30, after_minutes: 10, step_seconds: 60, max_series: 20}
  # 隨需撈 trace 還原當下的呼叫關係（互相關排根因用不到，但「傳播路徑」段落要靠它）
  - name: fetch_traces
    operator: ingestion.incident_traces
    params: {source_type: elasticsearch, before_minutes: 15, after_minutes: 0, max_spans: 20000, max_before_minutes: 60}
  - name: build_topology
    operator: rca.build_dynamic_topology
    params: {mode: merge, min_calls: 1}
  - name: fetch_logs
    operator: ingestion.incident_logs
    params: {source_type: elasticsearch, before_minutes: 5, after_minutes: 5, baseline_minutes: 60, max_logs: 5000}
  # preprocess：diff（一階差分）或 hybrid（只在異常時段保留穩健 z 分數、其他歸零）。
  # 目前刻意維持 diff、use_topology: false：在產生器的兩套標準答案上，hybrid 能把高原型事件的相關性救回來（r 0.98），
  # 但第一候選都排錯（同一分鐘一起變慢的服務只差 ±1 點，它照樣挑一個當「領先者」）；再加上 use_topology: true
  # （只比相鄰的服務，min_corr 維持 0.5）也一樣 0／2 命中：callee_slowdown 排 ord-svc（真實 bill-svc）、
  # load_amplification 排 api-gw（真實 cart-api）。diff 則是沒有候選、段落略過。錯的根因比沒有根因更糟，所以預設不切。
  # use_topology: true 沒有拓撲時不會報錯，只是沒有候選。數字見 README「RCA」一節。
  - name: root_cause
    operator: rca.root_cause.cross_correlation
    params: {max_lag_points: 10, min_corr: 0.5, use_topology: false, preprocess: diff}
  - name: report
    operator: rca.report
    params:
      sections: [summary, timeline, affected_entities, golden_signals, root_cause_candidates,
                 propagation_path, trace_evidence, log_patterns, similar_cases, suggested_actions]
      section_params: {trace_evidence: {traces_datasource: apm-traces}}
  - name: summary
    operator: enrichment.llm_summary
    optional: true
    params: {provider: noop}
  - name: briefing
    operator: enrichment.llm_briefing
    optional: true
    params: {provider: noop}
