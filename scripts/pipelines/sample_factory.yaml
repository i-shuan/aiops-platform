# 測試用的偵測管線樣本：這是 factory.yaml 在「偵測演算法只給 AIOps 平台自己當看門狗」這個決定之前的內容（2026-11-15），
# 只有 name 改成 sample_factory。出貨的 factory.yaml 現在只吃各團隊推進來的外部告警、不跑偵測器（docs/EXTERNAL_ALERTS.md）；
# 不在 aiops/ 裡、不進映像檔（Dockerfile 只 COPY aiops）；只有 tests/ 與 scripts/ 透過 scripts/sample_pipelines.py 載入得到。
name: sample_factory
description: "工廠：機台／Lot 指標，沒有 Pod、HTTP 與黃金訊號；流向來自 Lot 履歷"
# 這條管線的事件群預設用哪條 RCA 管線（POST /api/v1/rca 沒帶 workflow 時）。沒有 trace：不走 LLM（沒有 span 事實可判），用舊引擎，退回拓撲／Lot 流向推測
rca_workflow: rca_report

nodes:
  # 168 時段基準線每個「週幾幾點」要看過至少 2 週才會啟用（min_weeks），訓練窗口不夠長時它整條退回全段統計（等同 zscore）。
  # 要啟用：train_lookback_minutes 設 20160 以上（資料源有單次查詢點數上限就把 step_seconds 調大），建議累積 3~4 週。
  - name: fetch
    operator: ingestion.fetch
    params: {lookback_minutes: 60, train_lookback_minutes: 10080, retrain_minutes: 1440}

  # 異常檢測：三個偵測節點（時段基準、殘差突變、殘差漂移）開 snr，各自成立、沒有表決（寫法同 sample_it_otel）。
  # 這個組合只在每分鐘請求數上回測過（docs/RESIDUAL_SNR_ENSEMBLE.md），沒有在機台感測值上驗證過。
  - name: detect
    operator: detector.hourly_baseline
    params: {tz: Asia/Taipei, snr: {p_fa: 0.001, tz: Asia/Taipei}}
  - name: detect_rshift
    operator: detector.residual_shift
    params: {tz: Asia/Taipei, snr: {p_fa: 0.001, tz: Asia/Taipei}}
  - name: detect_rchronic
    operator: detector.residual_chronic
    params: {tz: Asia/Taipei, snr: {p_fa: 0.001, tz: Asia/Taipei}}
  - name: new_only
    operator: detector.new_only

  # ── 以下是批次層（所有序列的異常合併後）──
  - name: group_entity
    operator: alert.same_entity
  - name: group_lot_path
    operator: alert.lot_path_chain
    params: {window_minutes: 60}
  - name: score_p0
    operator: alert.p0_boost
    params: {entities: []}
  # 進行中的事件群吸收這一輪的新異常：一場事故從頭到尾只有一個 incident_uid、一張卡（不再每 30 分鐘另開一張）
  - name: absorb_open
    operator: alert.absorb_open
  - name: suppress_window
    operator: alert.suppress_window
  - name: suppress_dedup
    operator: alert.suppress_dedup
    params: {cooldown_minutes: 30}

  # 定嚴重度、產生通知內容
  - name: payload
    operator: alert.notify_payload
    params: {severity_thresholds: {P0: 10, P1: 6, P2: 3, P3: 0}}
  # 進行中事件群：用最新內容續命、升級時先關舊標籤再送新的、安靜滿 resolve_after_minutes 才結案（防抖動）。
  # 要排在 payload 之後（升級的嚴重度由 payload 算）
  - name: heartbeat
    operator: alert.heartbeat
    params: {resolve_after_minutes: 15}
  # 依環境變數 AIOPS_NOTIFIER 選 log 或 alertmanager；要固定就改 notifier.alertmanager
  - name: notify
    operator: notifier.auto
  # 自我健康心跳（Dead Man's Snitch）：寫入成功才送；排程停了或整輪失敗，ttl 到期就會收到 resolved
  - name: watchdog
    operator: notifier.watchdog
    params: {ttl_minutes: 15}

targets:
  # attrs.signal：製程參數的類別（給 RCA 建議處置的製程規則用；不是 IT 的黃金訊號也沒關係）
  #   單點超過 1500 W、或一步跳超過 300 W 就直接 P0；> 5000 W 當成感測器壞值，不判、記進 errors
  - {source_type: mock, query: 'rf_power{tool="ETCH-01"}', entity: ETCH-01, attrs: {dept: fab-etch, signal: rf_power}}
  - {source_type: mock, query: 'focus{tool="LITHO-02"}', entity: LITHO-02, attrs: {dept: fab-litho, signal: focus}}
