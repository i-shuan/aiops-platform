# 劇本：cart-api 重試風暴（load_amplification）。根因在上游，往下游 ord-svc、bill-svc 擴散。
# 傳播方向是 caller -> callee（負載放大），跟平台 engine/topology.propagation_edges 的 callee -> caller 相反，
# 拓撲排序很可能會排錯；這正是這份資料要量出來的。
name: nov03_cascade
namespace: gencascade
seed: 42
tz: Asia/Taipei
window: {start: 2026-10-20T00:00:00Z, end: 2026-11-04T00:00:00Z, step_seconds: 60}
base_rate_per_minute: 120          # 入口 api-gw 尖峰時段每分鐘請求數（下游依呼叫機率乘下去）
traces: {dense_per_minute: 12, sparse_per_hour: 6, margin_minutes: 120}
incidents:
  - id: inc_nov03_cart_cascade
    mechanism: load_amplification
    start: 2026-11-03T14:05:00Z
    end: 2026-11-03T16:20:00Z
    root_cause: cart-api
    envelope: {ramp_minutes: 10, plateau_minutes: 90, decay_minutes: 20}
    propagation:
      # cart-api 連線池耗盡：自己變慢、出錯，並且對 ord-svc 的呼叫重試成 2.5 倍
      - {entity: cart-api, lag_minutes: 0, latency_shift_ms: 280, trace_error_rate: 0.35, call_multiplier: 2.5}
      # 下游被灌爆，排隊之後才變慢
      - {entity: ord-svc, lag_minutes: 5, latency_shift_ms: 210, trace_error_rate: 0.25}
      - {entity: bill-svc, lag_minutes: 15, latency_shift_ms: 160, trace_error_rate: 0.15}
