# 產線指標模擬的演練環境：一個假裝是 MQ／CIM／AMHS 的 exporter，加一台自己的 Prometheus（保留 30 天，放得下回補的歷史）。
# 只給本機演練叢集用，不是任何出貨的 chart。模擬程式由 ConfigMap 掛進去：
#   kubectl create namespace line-sim
#   kubectl -n line-sim create configmap line-sim-code --from-file=scripts/line_sim/model.py --from-file=scripts/line_sim/exporter.py
#   kubectl apply -f scripts/line_sim/k8s.yaml
# 映像檔用叢集裡已經有的 aiops-platform（只是要一個有 Python 的映像，不跑平台程式）。
apiVersion: apps/v1
kind: Deployment
metadata: {name: line-sim, namespace: line-sim}
spec:
  replicas: 1
  selector: {matchLabels: {app: line-sim}}
  template:
    metadata: {labels: {app: line-sim}}
    spec:
      containers:
        - name: exporter
          image: aiops-platform:drill3
          imagePullPolicy: IfNotPresent
          command: ["python", "/sim/exporter.py"]
          ports: [{name: metrics, containerPort: 9464}]
          volumeMounts: [{name: code, mountPath: /sim}]
      volumes: [{name: code, configMap: {name: line-sim-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: line-sim, namespace: line-sim}
spec:
  selector: {app: line-sim}
  ports: [{name: metrics, port: 9464, targetPort: 9464}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: line-sim}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
      - job_name: line-sim
        static_configs: [{targets: ["line-sim.line-sim.svc:9464"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: line-sim}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: line-sim}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
