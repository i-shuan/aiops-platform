image:
  repository: aiops-lite
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# 事件驅動的時間設定（秒）。會寫進 ConfigMap 的 config.yaml，改了之後 helm upgrade 會自動重啟服務。
timing:
  debounceSeconds: 60      # 收到第一個 Webhook 後等多久才開始分析：等上下游告警到齊、等 ES 日誌落盤
  followupSeconds: 60      # 有進行中事故時，沒有新 Webhook 也每隔多久再跑一輪（結案、補寫註記、重試 LLM）
  closeAfterSeconds: 300   # 成員告警全部 resolved 之後，再安靜多久才結案（剛恢復又響不會另開一張）

service:
  port: 8080               # Grafana 的 Contact Point 打 http://<release>.<namespace>.svc:8080/webhook

grafana:
  url: ""            # 必填：公司 Grafana 的網址，例如 https://grafana.corp.example

# 機密不進 chart：先自己建好這個 Secret，鍵名如下
#   GRAFANA_TOKEN        Grafana Editor 服務帳號的 Token（必要）
#   AIOPS_WEBHOOK_TOKEN  Grafana Contact Point 帶的 Bearer 密鑰（必要；兩邊填一樣的值）
#   POSTGRES_PASSWORD  下面這個 PostgreSQL 的密碼（必要；會放進連線字串，請只用英數字）
#   LLM_API_KEY        LLM 的金鑰（沒有 LLM 可以不放）
existingSecret: aiops-lite

llm:
  apiUrl: ""         # OpenAI 相容端點（…/v1）；留空 = 不分析，註記第 2 行是 [未經分析] 原始摘要
  model: ""

logs:
  datasourceUid: ""  # Grafana 上 Elasticsearch 資料源的 uid；留空 = RCA 沒有日誌證據
  logIndex: "*"
  traceIndex: ""     # 沒有 Trace 就留空
  idFields: "eqp_id,lot_id,carrier_id"

# 系統層級的上下游關係（[上游, 下游]），3～5 條就夠；不要把機台寫進來
edges:
  - [mq-broker, cim-eap]
  - [cim-eap, amhs-mcs]

settings:
  tz: Asia/Taipei
  logLevel: INFO

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

postgres:
  image: postgres:16
  storage: 5Gi
  storageClassName: ""   # 留空 = 叢集預設的 StorageClass
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
