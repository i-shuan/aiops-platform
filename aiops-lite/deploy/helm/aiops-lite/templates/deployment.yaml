apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
spec:
  selector: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
spec:
  # 只能 1 個副本：debounce 的計時在記憶體裡。Recreate = 升級時先停舊的再起新的，不會兩個同時跑
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: aiops-lite
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          env:
            - {name: GRAFANA_URL, value: {{ required "grafana.url 必填" .Values.grafana.url | quote }}}
            - name: GRAFANA_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: GRAFANA_TOKEN}}
            - name: AIOPS_WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: AIOPS_WEBHOOK_TOKEN}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql+psycopg://aiops:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/aiops"}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: LLM_API_KEY, optional: true}}
            - {name: LLM_API_URL, value: {{ .Values.llm.apiUrl | quote }}}
            - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }}}
            - {name: AIOPS_PORT, value: "8080"}
            - {name: AIOPS_CONFIG_FILE, value: /etc/aiops-lite/config.yaml}
            - {name: AIOPS_ES_DATASOURCE_UID, value: {{ .Values.logs.datasourceUid | quote }}}
            - {name: AIOPS_LOG_INDEX, value: {{ .Values.logs.logIndex | quote }}}
            - {name: AIOPS_TRACE_INDEX, value: {{ .Values.logs.traceIndex | quote }}}
            - {name: AIOPS_ID_FIELDS, value: {{ .Values.logs.idFields | quote }}}
            - {name: AIOPS_TZ, value: {{ .Values.settings.tz | quote }}}
            - {name: AIOPS_LOG_LEVEL, value: {{ .Values.settings.logLevel | quote }}}
          volumeMounts:
            - {name: config, mountPath: /etc/aiops-lite, readOnly: true}
          resources: {{ toJson .Values.resources }}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
