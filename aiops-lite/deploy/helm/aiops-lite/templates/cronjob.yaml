apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  schedule: {{ required "schedule 必填" .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: cron}
          annotations:
            checksum/edges: {{ toJson .Values.edges | sha256sum }}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: aiops-lite
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: GRAFANA_URL, value: {{ required "grafana.url 必填" .Values.grafana.url | quote }}}
                - name: GRAFANA_TOKEN
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: GRAFANA_TOKEN}}
                - name: POSTGRES_PASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}}
                - {name: DATABASE_URL, value: "postgresql+psycopg://aiops:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/aiops"}
                - name: LLM_API_KEY
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: LLM_API_KEY, optional: true}}
                - {name: LLM_API_URL, value: {{ .Values.llm.apiUrl | quote }}}
                - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }}}
                - {name: AIOPS_EDGES_FILE, value: /etc/aiops-lite/edges.yaml}
                - {name: AIOPS_ES_DATASOURCE_UID, value: {{ .Values.logs.datasourceUid | quote }}}
                - {name: AIOPS_LOG_INDEX, value: {{ .Values.logs.logIndex | quote }}}
                - {name: AIOPS_TRACE_INDEX, value: {{ .Values.logs.traceIndex | quote }}}
                - {name: AIOPS_ID_FIELDS, value: {{ .Values.logs.idFields | quote }}}
                - {name: AIOPS_TZ, value: {{ .Values.settings.tz | quote }}}
                - {name: AIOPS_STEP_SECONDS, value: {{ .Values.settings.stepSeconds | quote }}}
                - {name: AIOPS_LOOKBACK_MINUTES, value: {{ .Values.settings.lookbackMinutes | quote }}}
                - {name: AIOPS_TRAIN_DAYS, value: {{ .Values.settings.trainDays | quote }}}
                - {name: AIOPS_RETRAIN_HOURS, value: {{ .Values.settings.retrainHours | quote }}}
                - {name: AIOPS_CLOSE_AFTER_ROUNDS, value: {{ .Values.settings.closeAfterRounds | quote }}}
                - {name: AIOPS_LOG_LEVEL, value: {{ .Values.settings.logLevel | quote }}}
              volumeMounts:
                - {name: edges, mountPath: /etc/aiops-lite, readOnly: true}
              resources: {{ toJson .Values.resources }}
          volumes:
            - name: edges
              configMap: {name: {{ .Release.Name }}-edges}
