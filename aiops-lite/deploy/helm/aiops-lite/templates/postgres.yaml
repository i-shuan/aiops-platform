apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - {name: POSTGRES_USER, value: aiops}
            - {name: POSTGRES_DB, value: aiops}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-config, key: POSTGRES_PASSWORD}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, aiops, -d, aiops]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources: {{ toJson .Values.postgres.resources }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage | quote }}}}
