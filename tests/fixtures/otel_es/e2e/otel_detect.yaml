name: otel_e2e_detect
description: "OTel 端到端驗證：從拋棄式 ES 的 OTel span 算每個服務入口的平均耗時，MAD 偵測"
nodes:
  - name: fetch
    operator: ingestion.fetch
    params: {lookback_minutes: 25, train_lookback_minutes: 90, retrain_minutes: 1440}
  - name: detect_mad
    operator: detector.mad
  - name: new_only
    operator: detector.new_only
  - name: group_entity
    operator: alert.same_entity
  - name: group_topology
    operator: alert.topology_chain
  - name: score_golden
    operator: alert.golden_signals
  - name: absorb_open
    operator: alert.absorb_open
  - name: suppress_dedup
    operator: alert.suppress_dedup
    params: {cooldown_minutes: 30}
  - name: payload
    operator: alert.notify_payload
    params: {severity_thresholds: {P0: 10, P1: 6, P2: 3, P3: 0}}
  - name: heartbeat
    operator: alert.heartbeat
    params: {resolve_after_minutes: 15}
  - name: notify
    operator: notifier.auto

targets:
  # OTel 的 duration 是奈秒；kind = Server 才是入口（每個請求一筆）
  - source_type: elasticsearch
    entity: checkout
    query: '{"index": "traces-*.otel-*", "value_field": "duration", "agg": "avg", "filter": [{"term": {"service.name": "checkout"}}, {"term": {"kind": "Server"}}]}'
  - source_type: elasticsearch
    entity: cart-api
    query: '{"index": "traces-*.otel-*", "value_field": "duration", "agg": "avg", "filter": [{"term": {"service.name": "cart-api"}}, {"term": {"kind": "Server"}}]}'
  - source_type: elasticsearch
    entity: ord-svc
    query: '{"index": "traces-*.otel-*", "value_field": "duration", "agg": "avg", "filter": [{"term": {"service.name": "ord-svc"}}, {"term": {"kind": "Consumer"}}]}'
