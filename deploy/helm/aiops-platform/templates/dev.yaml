{{- /* 只限開發的資源：values 裡的機密與沒有持久儲存的 PostgreSQL */ -}}
{{- if and .Values.devSecretEnv (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops.fullname" . }}-dev-env
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
  annotations:
    aiops/warning: "只限開發；正式環境請用 existingSecret"
type: Opaque
stringData:
  {{- range $k, $v := .Values.devSecretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.devPostgres.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops.fullname" . }}-dev-postgres
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
  annotations:
    aiops/warning: "只限開發：沒有持久儲存，pod 重建資料就沒了"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dev-postgres
  template:
    metadata:
      labels:
        {{- include "aiops.labels" . | nindent 8 }}
        app.kubernetes.io/component: dev-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.devPostgres.image }}
          env:
            - {name: POSTGRES_USER, value: aiops}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.devPostgres.password | quote }}}
            - {name: POSTGRES_DB, value: aiops}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aiops", "-d", "aiops"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-dev-postgres
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dev-postgres
  ports:
    - {name: pg, port: 5432, targetPort: pg}
{{- end }}
