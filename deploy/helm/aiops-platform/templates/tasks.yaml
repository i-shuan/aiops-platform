{{- /* 排程的 CronJob：tasks = 使用者告警管線（外部告警的收斂與事故卡），watchdog = 平台看門狗（偵測演算法監控平台自己）。
       兩個用同一份定義，只差名稱、排程與管線。*/ -}}
{{- define "aiops.cronjob" -}}
{{- $root := index . 0 -}}
{{- $name := index . 1 -}}
{{- $cfg := index . 2 -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "aiops.fullname" $root }}-{{ $name }}
  labels:
    {{- include "aiops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  schedule: {{ $cfg.schedule | quote }}
  # 上一輪還沒跑完就不開新的一輪，避免同一批異常被兩個 pod 同時處理
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "aiops.labels" $root | nindent 12 }}
            app.kubernetes.io/component: {{ $name }}
        spec:
          restartPolicy: Never
          containers:
            - name: {{ $name }}
              {{- include "aiops.container" $root | nindent 14 }}
              args: ["python", "-m", "aiops.interfaces.cli", "run-once", "-w", {{ $cfg.workflow | quote }}]
              resources:
                {{- toYaml $cfg.resources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: data, mountPath: /data}
          volumes:
            - {name: tmp, emptyDir: {}}
            - {name: data, emptyDir: {}}
{{- end -}}
{{- if .Values.tasks.enabled }}
{{ include "aiops.cronjob" (list . "tasks" .Values.tasks) }}
{{- end }}
{{- if .Values.watchdog.enabled }}
---
{{ include "aiops.cronjob" (list . "watchdog" .Values.watchdog) }}
{{- end }}
