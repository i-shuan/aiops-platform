{{- if .Values.tasks.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "aiops.fullname" . }}-tasks
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: tasks
spec:
  schedule: {{ .Values.tasks.schedule | quote }}
  # 上一輪還沒跑完就不開新的一輪，避免同一批異常被兩個 pod 同時處理
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "aiops.labels" . | nindent 12 }}
            app.kubernetes.io/component: tasks
        spec:
          restartPolicy: Never
          containers:
            - name: tasks
              {{- include "aiops.container" . | nindent 14 }}
              args: ["python", "-m", "aiops.interfaces.cli", "run-once", "-w", {{ .Values.tasks.workflow | quote }}]
              resources:
                {{- toYaml .Values.tasks.resources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: data, mountPath: /data}
          volumes:
            - {name: tmp, emptyDir: {}}
            - {name: data, emptyDir: {}}
{{- end }}
