image:
  repository: aiops-platform
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# 不是機密的設定（機密一律放 existingSecret）
env:
  AIOPS_NOTIFIER: alertmanager
  AIOPS_ALERTMANAGER_URL: http://aiops-alertmanager.aiops-platform.svc:9093
  # 人從瀏覽器點得到的平台網址（例：https://aiops.example.internal）。有設，告警卡片才會多一條 feedback_url
  # 連到平台的回饋頁（/feedback）；空字串 = 不產生連結
  AIOPS_PUBLIC_URL: ""

# 放機密環境變數的 Secret（chart 不建）：AIOPS_API_TOKEN（必填）、AIOPS_DATABASE_URL（正式必填）、
# AIOPS_ES_API_KEY、AIOPS_PROMETHEUS_TOKEN、AIOPS_ALERTMANAGER_TOKEN、AIOPS_LLM_API_KEY、AIOPS_FALLBACK_WEBHOOK…
existingSecret: ""

# 只限開發：直接在 values 裡給機密，chart 幫你建 Secret。正式環境不要用（會留在 helm release 紀錄裡）。
devSecretEnv: {}

# 排程：K8s CronJob 每次跑一輪 run-once（多副本也不會重複跑）。
# schedule 間隔要遠小於 Alertmanager 的 resolveTimeout（預設 1h），心跳才不會斷。
tasks:
  enabled: true
  schedule: "*/5 * * * *"
  # 要跑哪條管線：aiops/pipelines/<子資料夾>/<名稱>.yaml（it_otel、it_apm、factory、metrics_only）。
  # 這四條只處理各團隊經 webhook 推進來的外部告警（docs/EXTERNAL_ALERTS.md），不抓資料、不跑偵測器
  workflow: metrics_only
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# 平台看門狗：用平台自己的偵測演算法監控平台自己（排程有沒有在跑、整輪失敗、各團隊的心跳告警），
# 讀的只有平台資料庫裡的紀錄（aiops/pipelines/watchdog/platform_watchdog.yaml、docs/WATCHDOG.md）。
# YAML 裡被監控的管線要跟上面 tasks.workflow 一致；換了 tasks.workflow 就要改 YAML 的 targets
watchdog:
  enabled: true
  schedule: "*/5 * * * *"
  workflow: platform_watchdog
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# 關係圖的 trace 那一半：定期從 trace 來源把「誰呼叫誰」沉澱進 service_edges（aiops/pipelines/control/admin_topology_refresh.yaml）。
# 沒有這個排程，又沒有人宣告依賴（POST /api/v1/ingestion/graph/import）時，關係圖是空的，連鎖告警不會併成一張卡。
# 每小時一次、每次回看 60 分鐘（動作的預設值）：窗口剛好相接，呼叫次數不重複累加；代價是新的呼叫關係最慢一小時後才進圖。
# 超過 7 天沒再看到的邊會被移除。trace 資料源沒設定（純指標的部署）時這個動作自己略過，不會失敗。
# 限制：只寫「不分環境」的那一份圖；管線有設 environment 的，要另外用 API 帶 environment 觸發。
topology:
  enabled: true
  schedule: "7 * * * *"
  workflow: admin_topology_refresh
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# 只限開發：一起裝一台沒有持久儲存的 PostgreSQL（pod 重建資料就沒了）。
# 開啟時若沒有另外給 AIOPS_DATABASE_URL，平台會自動連這台。
devPostgres:
  enabled: false
  image: postgres:16-alpine
  password: aiops-dev-only
