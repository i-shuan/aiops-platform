{{- /* provisioning 的檔都在 chart 的 files/ 裡（Helm 只讀得到 chart 資料夾內的檔）。名稱沿用舊 chart，
       才能用 helm upgrade 直接接手叢集上已在跑的 grafana release。*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  aiops.yaml: |
{{- $ds := .Files.Get "files/datasource.yaml" }}
{{- $ds = $ds | replace "__ES_INDEX_METRICS__" .Values.esIndices.metrics | replace "__ES_INDEX_TRACES__" .Values.esIndices.traces | replace "__ES_INDEX_LOGS__" .Values.esIndices.logs | replace "__DB_SSLMODE__" .Values.platformDb.sslmode }}
{{ $ds | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  aiops.yaml: |
    apiVersion: 1
    providers:
      - name: aiops
        orgId: 1
        folder: AIOps
        type: file
        allowUiUpdates: false
        options:
          path: /etc/grafana/provisioning/dashboards/aiops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
