# 資料源只有「讀」：三個 APM 的 ES，加上平台的 Alertmanager。${...} 由 Grafana 從環境變數展開（envSecret）。
# 守則：沒有 PostgreSQL（舊引擎的資料庫已移除）、不開任何寫入、Alertmanager 只顯示告警。
apiVersion: 1
datasources:
  - name: apm-metrics
    uid: apm-metrics
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_METRICS__"
      timeField: "@timestamp"
      timeInterval: "1m"           # APM 的指標一分鐘一筆；auto 的間隔不要比它短，不然每隔一格是空的、線連不起來
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  - name: apm-traces
    uid: apm-traces
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_TRACES__"
      timeField: "@timestamp"
      timeInterval: "1m"
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  - name: apm-logs
    uid: apm-logs
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_LOGS__"
      timeField: "@timestamp"
      logMessageField: error.exception.message   # Log 面板每一行顯示的欄位（APM 例外的訊息）
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  # 平台推送通知的獨立 Alertmanager：只用來「顯示」告警，不寫入、不從這裡發通知
  - name: aiops-alertmanager
    uid: aiops-alertmanager
    type: alertmanager
    access: proxy
    url: ${AIOPS_ALERTMANAGER_URL}
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
