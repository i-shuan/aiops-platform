# 資料源只有「讀」：三個 APM 的 ES、平台的 Alertmanager、平台資料庫的唯讀帳號。${...} 由 Grafana 從環境變數展開（envSecret）。
# 守則：不開任何寫入、Alertmanager 只顯示告警；PostgreSQL 只能用唯讀帳號（只有兩張資料健康度的表的 SELECT）。
# 舊引擎的資料庫已移除，這裡的 aiops-platform-db 是現在平台自己的資料庫，不是同一個東西。
apiVersion: 1
datasources:
  - name: apm-metrics
    uid: apm-metrics
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_METRICS__"
      timeField: "@timestamp"
      timeInterval: "1m"           # APM 的指標一分鐘一筆；auto 的間隔不要比它短，不然每隔一格是空的、線連不起來
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  - name: apm-traces
    uid: apm-traces
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_TRACES__"
      timeField: "@timestamp"
      timeInterval: "1m"
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  - name: apm-logs
    uid: apm-logs
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "__ES_INDEX_LOGS__"
      timeField: "@timestamp"
      logMessageField: error.exception.message   # Log 面板每一行顯示的欄位（APM 例外的訊息）
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}

  # 平台推送通知的獨立 Alertmanager：只用來「顯示」告警，不寫入、不從這裡發通知
  - name: aiops-alertmanager
    uid: aiops-alertmanager
    type: alertmanager
    access: proxy
    url: ${AIOPS_ALERTMANAGER_URL}
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # 平台資料庫（PostgreSQL，Grafana 內建的資料源，不用裝外掛）：只給「資料健康度」儀表板讀
  # data_stream_health、pipeline_run_health。帳號必須是唯讀帳號（建法與授權見 migrations/postgres/0011_data_health.sql），
  # 不要拿平台自己那組可寫的帳號（AIOPS_DATABASE_URL）來用。位址、資料庫名稱、帳密都來自 envSecret。
  - name: aiops-platform-db
    uid: aiops-platform-db
    type: grafana-postgresql-datasource
    access: proxy
    url: ${AIOPS_DB_HOST}              # 主機:埠，例如 aiops-postgres.aiops.svc:5432
    user: ${AIOPS_DB_RO_USER}
    jsonData:
      database: ${AIOPS_DB_NAME}
      sslmode: "__DB_SSLMODE__"
      maxOpenConns: 5                  # 儀表板 7 個面板、每分鐘刷新一次：不需要更多連線
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${AIOPS_DB_RO_PASSWORD}
