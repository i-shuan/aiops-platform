# 這台 Alertmanager 只做「純路由」：要不要發、發什麼都由 aiops-platform 決定好才推過來。
# 守則（CLAUDE.md 第 5 節）：這裡不設 silence、不設 inhibit_rules、路由只比對 labels。

image:
  repository: quay.io/prometheus/alertmanager
  tag: v0.28.1
  pullPolicy: IfNotPresent

replicas: 1

service:
  type: ClusterIP
  port: 9093

# 平台每輪排程會重送進行中的事件群（心跳），安靜夠久就補送 endsAt 結案。
# 這個時限只是保險：平台當掉、不再心跳時，告警最多掛這麼久就自己結案。
# 必須比平台排程間隔長很多（排程 5 分鐘一輪 -> 1h 綽綽有餘）。
resolveTimeout: 1h

route:
  # 平台送來的一則通知 = 一個事件群 × 一個部門，不再二次分組。
  # 一定要用全域唯一的 incident_uid；平台的整數 id 在資料庫重建後會重複
  groupBy: ["incident_uid", "dept"]
  groupWait: 10s
  groupInterval: 5m
  # 平台已做 dedup；這裡只是保險，避免同一則被反覆提醒
  repeatInterval: 24h
  # 沒對到任何部門的通知送到這裡（預設不送任何地方）
  defaultReceiver: unrouted

# 依部門分流：dept label 等於 dept 就送到 receiver
# 例：
#   deptRoutes:
#     - dept: payments
#       receiver: payments-slack
deptRoutes: []

# 平台自我健康心跳（Dead Man's Snitch）的路由。平台每輪成功跑完會送 alertname=AIOpsWatchdog，
# endsAt = 現在 + ttl；平台停了就沒人續命、告警過期。Alertmanager 本身不會因為告警消失而發新告警，
# 所以 P0 要由接收端發：
#   A（建議）receiver 指向外部死人開關服務（例如 Healthchecks.io 的 ping URL，send_resolved: false）：
#      活著時每 repeatInterval 打卡一次，打卡停了超過寬限時間由外部服務發 P0；Alertmanager 或整個叢集掛了也抓得到。
#   B receiver 指向自己的告警平台 webhook（send_resolved: true），把 status=resolved 當成「AIOps 停了」；
#      會晚一個 groupInterval 才送，Alertmanager 自己掛了則完全不會送。
# 完整範例見 values-channels.example.yaml。
watchdogRoute:
  enabled: false
  receiver: aiops-deadman
  groupInterval: 1m
  repeatInterval: 5m

# 原樣放進 alertmanager.yml 的 receivers。webhook URL 等機密會進 Secret，不進 ConfigMap。
# Slack／Teams 的完整寫法見 values-channels.example.yaml。平台會送恢復通知，所以可以開 send_resolved。
receivers:
  - name: unrouted

# 告警狀態（進行中的告警、通知紀錄）存放。關閉時用 emptyDir，pod 重建就會清空；正式環境請開啟。
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# 給管 Grafana 的人用：Grafana 只把這台 Alertmanager 加成資料源來「顯示」。
# 若 Grafana 用 sidecar 自動載入資料源，開啟後會建一個帶 sidecar label 的 ConfigMap。
displayDatasource:
  enabled: false
  sidecarLabel: grafana_datasource
  sidecarLabelValue: "1"
