{{- $routeReceivers := list -}}
{{- range .Values.deptRoutes }}{{ $routeReceivers = append $routeReceivers .receiver }}{{ end -}}
{{- $wd := .Values.watchdogRoute | default dict -}}
{{- if $wd.enabled }}{{ $routeReceivers = append $routeReceivers $wd.receiver }}{{ end -}}
{{- $known := list -}}
{{- range .Values.receivers }}{{ $known = append $known .name }}{{ end -}}
{{- range (append $routeReceivers .Values.route.defaultReceiver) }}
{{- if not (has . $known) }}{{ fail (printf "receiver %q 沒有定義在 .Values.receivers" .) }}{{ end }}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops-am.fullname" . }}-config
  labels:
    {{- include "aiops-am.labels" . | nindent 4 }}
type: Opaque
stringData:
  alertmanager.yml: |
    # 由 helm chart 產生。純路由：不得加 inhibit_rules、不得在這裡設靜音（靜音只在平台）。
    global:
      resolve_timeout: {{ .Values.resolveTimeout }}
    route:
      receiver: {{ .Values.route.defaultReceiver | quote }}
      group_by: {{ toJson .Values.route.groupBy }}
      group_wait: {{ .Values.route.groupWait }}
      group_interval: {{ .Values.route.groupInterval }}
      repeat_interval: {{ .Values.route.repeatInterval }}
      routes:
      {{- if $wd.enabled }}
        # 平台自我健康心跳（notifier.watchdog）：排在部門路由前面、不往下比對。
        # 活著時每 repeat_interval 重送一次（= 對死人開關服務打卡）；平台停了心跳就過期，打卡跟著停。
        - receiver: {{ $wd.receiver | quote }}
          matchers:
            - alertname = "AIOpsWatchdog"
          group_by: ["alertname", "pipeline"]
          group_wait: 0s
          group_interval: {{ $wd.groupInterval | default "1m" }}
          repeat_interval: {{ $wd.repeatInterval | default "5m" }}
          continue: false
      {{- end }}
      {{- range .Values.deptRoutes }}
        - receiver: {{ .receiver | quote }}
          matchers:
            - dept = {{ .dept | quote }}
      {{- else }}
      {{- if not $wd.enabled }} []{{ end }}
      {{- end }}
    receivers:
      {{- toYaml .Values.receivers | nindent 6 }}
