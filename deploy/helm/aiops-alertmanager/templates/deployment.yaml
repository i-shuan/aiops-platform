apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-am.fullname" . }}
  labels:
    {{- include "aiops-am.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate  # PVC 是 ReadWriteOnce，新舊 pod 不能同時掛
  {{- end }}
  selector:
    matchLabels:
      {{- include "aiops-am.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aiops-am.selector" . | nindent 8 }}
      annotations:
        # 設定改了就重啟，讓新路由生效
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          secret:
            secretName: {{ include "aiops-am.fullname" . }}-config
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aiops-am.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
