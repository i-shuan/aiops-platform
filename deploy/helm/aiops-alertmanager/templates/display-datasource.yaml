{{- if .Values.displayDatasource.enabled }}
# 讓 Grafana 把這台 Alertmanager 當資料源「顯示」告警；Grafana 不需要任何寫入權限。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops-am.fullname" . }}-display-datasource
  labels:
    {{- include "aiops-am.labels" . | nindent 4 }}
    {{ .Values.displayDatasource.sidecarLabel }}: {{ .Values.displayDatasource.sidecarLabelValue | quote }}
data:
  aiops-alertmanager.yaml: |
    apiVersion: 1
    datasources:
      - name: aiops-alertmanager
        type: alertmanager
        access: proxy
        url: http://{{ include "aiops-am.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
{{- end }}
