# aiops-lite 的 Helm 設定範本。所有設定會產生成一份 config.yaml，放進 Secret 掛載給 Pod（程式沒有任何環境變數）。
#
# 這個檔案只放空白範本，可以進 Git。真實的 Token 與密碼寫在另一份「不進 Git」的檔案（例如 secrets.values.yaml，
# .gitignore 已排除），部署時一起帶：
#   helm upgrade --install aiops-lite deploy/helm/aiops-lite -f secrets.values.yaml
# secrets.values.yaml 只需要填下面標「必填」的那幾個值，例如：
#   grafana: {url: https://grafana.corp.example, token: glsa_xxx}
#   webhook: {token: xxx}
#   postgres: {password: xxx}

image:
  repository: aiops-lite
  tag: "0.6.3"
  pullPolicy: IfNotPresent

grafana:
  url: ""        # 必填
  token: ""      # 必填：Editor 服務帳號的 Token

webhook:
  token: ""      # 必填：Grafana Contact Point 帶的 Bearer 密鑰（兩邊填一樣）

service:
  port: 8080     # Grafana 的 Contact Point 打 http://<release>.<namespace>.svc:8080/webhook

postgres:
  password: ""   # 必填：只用英數字（會放進連線字串）
  image: postgres:16
  storage: 5Gi
  storageClassName: ""   # 留空 = 叢集預設的 StorageClass
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

database:
  url: ""        # 留空 = 連上面這個 PostgreSQL；要連外部資料庫才填完整連線字串

llm:             # 整段留空 = 不分析，註記第 2 行是 [未經分析] 原始摘要
  url: ""        # OpenAI 相容端點（…/v1）
  apiKey: ""
  model: ""
  temperature: null         # null = 不送，用模型的預設值（有些模型只接受預設值）
  retryInitialSeconds: 60   # 分析失敗後第一次等多久再試；之後每失敗一次加倍，成功歸零
  retryMaxSeconds: 1800     # 退避的上限
  # 自訂系統提示詞（多行文字）。留空 = 用程式內建的。必須保留「只輸出含 summary、systems、ids 的 JSON」，不然服務啟動時報錯。
  # 有填的話 chart 會把它放進同一個 Secret 的 system_prompt.txt，並自動設好 llm.system_prompt_file。
  systemPrompt: ""

logs:            # datasourceUid 留空 = RCA 沒有日誌證據
  type: victorialogs   # victorialogs 或 elasticsearch
  datasourceUid: ""    # Grafana 上那個資料源的 uid（VictoriaLogs 要先在 Grafana 裝外掛 victoriametrics-logs-datasource）
  extraFilter: ""      # 只有 victorialogs：加在每條日誌查詢最前面的 LogsQL 條件，例如 '{namespace="factory"}'；留空 = 全部
  index: ""            # 只有 elasticsearch：要查的索引，例如 "fluentd-*"；留空 = "*"
  idFields: [eqp_id, lot_id, carrier_id]
  # 日誌沒有等級欄位（沒拆欄位的容器輸出）：level 設成 ""，改用訊息文字挑錯誤日誌（會誤撈，見 CONFIG.md）。
  # elasticsearch 另外可以設 time、message（預設 "@timestamp"、message）；VictoriaLogs 固定是 _time、_msg，不能設
  fields: {service: service.name, level: log.level}

traces:          # datasourceUid 留空 = 沒有呼叫鏈證據（有埋點的 IT 服務才需要）
  type: victoriatraces # victoriatraces 或 tempo
  datasourceUid: ""    # victoriatraces：Jaeger 型別資料源（URL 指到 VictoriaTraces 的 /select/jaeger）的 uid；tempo：Tempo 資料源的 uid

outputs:         # 註記以外的兩個出口；url 留空 = 佔位（不送，只把本來會送的內容記進資料庫的 deliveries 表）
  incidentApi: {url: "", token: ""}                    # 事故開單／更新／結案時 POST 給下游（告警中心、派工系統）
  remediation: {url: "", token: "", enabled: false}    # 自動修復（Conductor）：只看告警規則上的 aiops_remediation 標籤；enabled=false 只記錄

metrics:         # datasourceUid 或 queries 留空 = RCA 沒有指標走勢這包證據
  datasourceUid: ""    # Grafana 上 Prometheus 型別資料源的 uid（URL 指到 VictoriaMetrics；Prometheus、Mimir 也可以）
  queries: []          # 事故時要查的指標；$service 會換成系統名稱。services 有寫就只對那幾個系統查。例如：
  #   - {name: 請求量（每秒）, expr: 'sum(rate(http_requests_total{service="$service"}[5m]))'}
  #   - {name: 佇列待處理訊息數, expr: 'sum by (queue) (rabbitmq_queue_messages_ready{service="$service"})', services: [mq-broker]}
  # 時間窗、取樣間隔等進階項目寫在 extraConfig.metrics（lookback_minutes、step_seconds、max_points、max_series）

timezone: Asia/Taipei
logLevel: INFO

# 進階的選填設定：照 config.yaml 的結構寫，會合併進產生的 config.yaml（同名的鍵以這裡為準）。
# 可用的鍵與預設值見 config.example.yaml 裡註解掉的那些行，以及 CONFIG.md。平常留空。例如：
#   extraConfig:
#     llm: {timeout_seconds: 180, id_pattern: "(EQP|LOT|FOUP)[-A-Z0-9]+"}
#     logs: {error_levels: [E, SEVERE], max_hits: 500}
#     labels: {service: system}
#     healthcheck: {stuck_seconds: 1200}
extraConfig: {}

# 事件驅動的時間設定（秒）。改了之後 helm upgrade 會自動重啟服務。
timing:
  debounceSeconds: 60      # 收到第一個 Webhook 後等多久才開始分析：等上下游告警到齊、等日誌寫進 VictoriaLogs
  followupSeconds: 60      # 有進行中事故時，沒有新 Webhook 也每隔多久再跑一輪（結案、補寫註記、重試 LLM）
  closeAfterSeconds: 300   # 成員告警全部 resolved 之後，再安靜多久才結案（剛恢復又響不會另開一張）

# 選填：系統層級的上下游關係（[上游, 下游]）。不寫也能分析；寫了的好處是有關係的系統同時告警時會併成同一張事故，
# LLM 也多一個「誰可能影響誰」的線索。例如：
#   edges:
#     - [mq-broker, cim-eap]
#     - [cim-eap, amhs-mcs]
edges: []

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
