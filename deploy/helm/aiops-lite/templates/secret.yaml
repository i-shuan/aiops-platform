# 整份 config.yaml 放在 Secret（裡面有 Token 與密碼），掛載成檔案給 Pod 讀。程式沒有任何環境變數設定。
# 內容 = 常用設定（values 上面那些欄位）+ extraConfig（進階選填設定，照 config.yaml 的結構寫，同名的鍵以 extraConfig 為準）。
{{- $config := mergeOverwrite (include "aiops-lite.baseConfig" . | fromYaml) (deepCopy (.Values.extraConfig | default dict)) }}
{{- if .Values.llm.systemPrompt }}
{{- $_ := set $config.llm "system_prompt_file" "/etc/aiops/system_prompt.txt" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels: {app.kubernetes.io/name: aiops-lite, app.kubernetes.io/instance: {{ .Release.Name }}}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password 必填" .Values.postgres.password | quote }}
  config.yaml: |
{{ toYaml $config | indent 4 }}
  {{- if .Values.llm.systemPrompt }}
  system_prompt.txt: |
{{ .Values.llm.systemPrompt | indent 4 }}
  {{- end }}
