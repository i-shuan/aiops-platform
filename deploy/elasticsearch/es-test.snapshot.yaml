# 叢集上 es-test 的 ES release（helm release elasticsearch，chart elasticsearch-test-0.1.0）的快照。
# 這**不是 chart**：原始 chart 不在任何本機 repo，這份是從執行中的 release 匯出的 manifest，只供重建時參考。
# 已去掉整份 Secret 與所有明文機密；引用 Secret 的地方保留引用，重建時要自己建對應的 Secret。
# 資料（21Gi 的 PVC）不在這裡，快照也不含資料。
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
    role: data
  ports:
  - name: http
    port: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: es-node-0
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: elasticsearch-0
  ports:
  - name: transport
    port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: es-node-1
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: elasticsearch-1
  ports:
  - name: transport
    port: 9301
---
apiVersion: v1
kind: Service
metadata:
  name: es-node-2
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: elasticsearch-voter-0
  ports:
  - name: transport
    port: 9302
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        role: data
    spec:
      containers:
      - name: elasticsearch
        image: docker.io/library/elasticsearch:8.19.23
        command:
        - bash
        - -c
        - p=$((9300 + ${NODE_INDEX:-${HOSTNAME##*-}})); exec /usr/local/bin/docker-entrypoint.sh
          eswrapper -Etransport.port=$p
        env:
        - name: http.host
          value: 0.0.0.0
        - name: discovery.seed_hosts
          value: 127.0.0.1:9300,127.0.0.1:9301,127.0.0.1:9302
        - name: cluster.initial_master_nodes
          value: elasticsearch-0
        - name: transport.host
          value: 127.0.0.1
        - name: xpack.security.enabled
          value: 'true'
        - name: xpack.security.http.ssl.enabled
          value: 'false'
        - name: xpack.security.transport.ssl.enabled
          value: 'true'
        - name: xpack.security.transport.ssl.verification_mode
          value: certificate
        - name: xpack.security.transport.ssl.key
          value: certs/node.key
        - name: xpack.security.transport.ssl.certificate
          value: certs/node.crt
        - name: xpack.security.transport.ssl.certificate_authorities
          value: certs/ca.crt
        - name: cluster.routing.allocation.disk.threshold_enabled
          value: 'false'
        - name: path.repo
          value: /snapshots
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: es-elastic
              key: password
        - name: ES_JAVA_OPTS
          value: -Xms1g -Xmx1g
        ports:
        - name: http
          containerPort: 9200
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - 'if [ -s /probe/PROBE_ES_API_KEY ]; then curl -sf -H "Authorization:
              ApiKey $(cat /probe/PROBE_ES_API_KEY)" localhost:9200/ >/dev/null; else
              curl -sf -u elastic:$ELASTIC_PASSWORD localhost:9200/_cluster/health
              >/dev/null; fi'
          periodSeconds: 5
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        - name: probe-key
          mountPath: /probe
          readOnly: true
        - name: certs
          mountPath: /usr/share/elasticsearch/config/certs
          readOnly: true
        - name: snapshots
          mountPath: /snapshots
      - name: transport-proxy
        image: docker.io/alpine/socat:1.8.0.3
        command:
        - sh
        - -c
        args:
        - "n=${NODE_INDEX:-${HOSTNAME##*-}}; me=$((9300 + n))\nsocat TCP-LISTEN:$me,bind=$POD_IP,fork,reuseaddr\
          \ TCP:127.0.0.1:$me &\nfor o in 0 1 2 ; do\n  [ \"$o\" = \"$n\" ] && continue\n\
          \  socat TCP-LISTEN:$((9300 + o)),bind=127.0.0.1,fork,reuseaddr TCP:es-node-$o.es-test.svc:$((9300\
          \ + o)) &\ndone\nwait\n"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      volumes:
      - name: probe-key
        secret:
          secretName: es-probe-key
          optional: true
      - name: certs
        secret:
          secretName: es-transport-certs
      - name: snapshots
        hostPath:
          path: /var/lib/aiops-es-test-snapshots
          type: DirectoryOrCreate
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: chown
        image: docker.io/library/busybox:1.37
        command:
        - sh
        - -c
        - chown -R 1000:1000 /data /snapshots
        volumeMounts:
        - name: data
          mountPath: /data
        - name: snapshots
          mountPath: /snapshots
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch-voter
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-voter
  template:
    metadata:
      labels:
        app: elasticsearch-voter
        role: voting-only
    spec:
      containers:
      - name: elasticsearch
        image: docker.io/library/elasticsearch:8.19.23
        command:
        - bash
        - -c
        - p=$((9300 + ${NODE_INDEX:-${HOSTNAME##*-}})); exec /usr/local/bin/docker-entrypoint.sh
          eswrapper -Etransport.port=$p
        env:
        - name: NODE_INDEX
          value: '2'
        - name: node.roles
          value: master,voting_only
        - name: http.host
          value: 127.0.0.1
        - name: discovery.seed_hosts
          value: 127.0.0.1:9300,127.0.0.1:9301,127.0.0.1:9302
        - name: cluster.initial_master_nodes
          value: elasticsearch-0
        - name: transport.host
          value: 127.0.0.1
        - name: xpack.security.enabled
          value: 'true'
        - name: xpack.security.http.ssl.enabled
          value: 'false'
        - name: xpack.security.transport.ssl.enabled
          value: 'true'
        - name: xpack.security.transport.ssl.verification_mode
          value: certificate
        - name: xpack.security.transport.ssl.key
          value: certs/node.key
        - name: xpack.security.transport.ssl.certificate
          value: certs/node.crt
        - name: xpack.security.transport.ssl.certificate_authorities
          value: certs/ca.crt
        - name: cluster.routing.allocation.disk.threshold_enabled
          value: 'false'
        - name: path.repo
          value: /snapshots
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: es-elastic
              key: password
        - name: ES_JAVA_OPTS
          value: -Xms256m -Xmx256m
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - 'if [ -s /probe/PROBE_ES_API_KEY ]; then curl -sf -H "Authorization:
              ApiKey $(cat /probe/PROBE_ES_API_KEY)" localhost:9200/ >/dev/null; else
              curl -sf -u elastic:$ELASTIC_PASSWORD localhost:9200/_cluster/health
              >/dev/null; fi'
          periodSeconds: 5
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 640Mi
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        - name: probe-key
          mountPath: /probe
          readOnly: true
        - name: certs
          mountPath: /usr/share/elasticsearch/config/certs
          readOnly: true
        - name: snapshots
          mountPath: /snapshots
      - name: transport-proxy
        image: docker.io/alpine/socat:1.8.0.3
        command:
        - sh
        - -c
        args:
        - "n=${NODE_INDEX:-${HOSTNAME##*-}}; me=$((9300 + n))\nsocat TCP-LISTEN:$me,bind=$POD_IP,fork,reuseaddr\
          \ TCP:127.0.0.1:$me &\nfor o in 0 1 2 ; do\n  [ \"$o\" = \"$n\" ] && continue\n\
          \  socat TCP-LISTEN:$((9300 + o)),bind=127.0.0.1,fork,reuseaddr TCP:es-node-$o.es-test.svc:$((9300\
          \ + o)) &\ndone\nwait\n"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_INDEX
          value: '2'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      volumes:
      - name: probe-key
        secret:
          secretName: es-probe-key
          optional: true
      - name: certs
        secret:
          secretName: es-transport-certs
      - name: snapshots
        hostPath:
          path: /var/lib/aiops-es-test-snapshots
          type: DirectoryOrCreate
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: chown
        image: docker.io/library/busybox:1.37
        command:
        - sh
        - -c
        - chown -R 1000:1000 /data /snapshots
        volumeMounts:
        - name: data
          mountPath: /data
        - name: snapshots
          mountPath: /snapshots
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
