# 排程工作範例：python -m aiops.tasks run-once -c configs/jobs.example.yaml
# 一個 job = 一條管線。job 名稱同時是 anomalies 的 pipeline 標籤與告警游標的名字，改名等於重新開始。
jobs:
  - name: it-cpu
    preset: it_otel
    detector_name: zscore
    # params 不寫 = 用 tuning 核准後的現行參數
    step_seconds: 60
    lookback_minutes: 60          # 每輪偵測看最近 60 分鐘
    train_lookback_minutes: 1440  # 批次訓練用最近一天
    retrain_minutes: 1440         # 模型超過一天才重訓
    targets:
      - source_type: mock
        query: cpu_usage{service="cart"}
        entity: cart
        attrs: {dept: payments}
      - source_type: mock
        query: cpu_usage{service="redis"}
        entity: redis
        attrs: {dept: platform}
    context:
      topology: [["cart", "redis"]]   # [caller, callee]
      p0_entities: ["cart"]
